name: Claude Code Check-in Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  run-claude-skill:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          echo "PR_DIFF<<EOF" >> $GITHUB_ENV
          git diff origin/${{ github.base_ref }}..HEAD >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LiteLLM
        run: pip install litellm

      - name: Run LiteLLM Review
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
        run: |
          python -c "
          import os
          from litellm import completion

          diff = os.environ.get('PR_DIFF', '')
          if not diff.strip():
              print('No diff found.')
              exit(0)

          prompt = f'''A code check-in occurred on this PR. Please review the following diff:

          {diff}

          1. Review latest changes.
          2. Verify code standards.
          3. Highlight security risks or bugs.
          '''

          response = completion(
              model='claude-3-7-sonnet-20250219',
              api_key=os.environ['LITELLM_API_KEY'],
              api_base=os.environ['LITELLM_BASE_URL'],
              messages=[{'role': 'user', 'content': prompt}]
          )

          review_text = response.choices[0].message.content
          with open('review.md', 'w') as f:
              f.write(review_text)
          "

      - name: Post Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('review.md')) {
              const review = fs.readFileSync('review.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### 🤖 Claude Review via LiteLLM\n\n${review}`
              });
            }
